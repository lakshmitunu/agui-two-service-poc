services:
  agent-service:
    build: .
    command: uvicorn agent_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      AGENT_URL: http://agent-service:8000/agent
    ports:
      - "8501:8501"
    depends_on:
      agent-service:
        condition: service_healthy

