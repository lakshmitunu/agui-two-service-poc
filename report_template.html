<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f7f8fb; --fg:#161b26; --muted:#5c6577; --line:#e2e6ee;
  --accent:#2f5bea; --accent-soft:#e8eefd;
  --s-todo:#aab2c2; --s-prog:#3b82f6; --s-rev:#f2a20c; --s-done:#1f9d55;
  --good:#1f7a4a; --good-bg:#e1f4e9; --warn:#9a6200; --warn-bg:#fdf0d2; --bad:#b4262c; --bad-bg:#fde4e4; --idle:#4b5468; --idle-bg:#e9ecf3;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Space Grotesk','Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171c27; --surface2:#1c2230; --fg:#e8ecf4; --muted:#98a2b6; --line:#2a3242;
  --accent:#7b9cff; --accent-soft:#222d52;
  --s-todo:#556078; --s-prog:#4c8ff5; --s-rev:#e8a824; --s-done:#35b672;
  --good:#6ee0a0; --good-bg:#16342a; --warn:#f2c660; --warn-bg:#3a2e12; --bad:#ff8f93; --bad-bg:#3d1c1f; --idle:#aab3c6; --idle-bg:#252c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --surface2:#1c2230; --fg:#e8ecf4; --muted:#98a2b6; --line:#2a3242;
  --accent:#7b9cff; --accent-soft:#222d52;
  --s-todo:#556078; --s-prog:#4c8ff5; --s-rev:#e8a824; --s-done:#35b672;
  --good:#6ee0a0; --good-bg:#16342a; --warn:#f2c660; --warn-bg:#3a2e12; --bad:#ff8f93; --bad-bg:#3d1c1f; --idle:#aab3c6; --idle-bg:#252c3b; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:17px}
h3{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:var(--font)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
.top .meta{color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.key{font-family:var(--display);font-weight:600;color:var(--accent)}
.stamp{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.card header p{margin:0;color:var(--muted);font-size:12.5px}
.donutrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.donut text{fill:var(--fg);font-family:var(--display)}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .n{margin-left:auto;font-weight:600}
.legend .p{color:var(--muted);width:42px;text-align:right}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:10px;align-items:center}
.row .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lab small{color:var(--muted);display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.row .tot{text-align:right;font-weight:600}
.track{height:14px;display:flex}
.bar{display:flex;height:100%;border-radius:4px;overflow:hidden;gap:1px;background:var(--surface)}
.bar i{display:block;height:100%;min-width:2px}
.key-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.key-legend span{display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.scroll.tall{max-height:380px;overflow-y:auto}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.idle{background:var(--idle-bg);color:var(--idle)}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button.vcard{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
button.vcard:hover{border-color:var(--accent)}
button.vcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vcard .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.vcard .name{font-family:var(--display);font-weight:600;font-size:18px;overflow-wrap:anywhere}
.vcard .d{color:var(--muted);font-size:12.5px}
.vcard .cnt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px;flex-wrap:wrap}
.vcard .cnt b{color:var(--fg)}
.hint{color:var(--muted);font-size:12.5px}
.mx td,.mx th{text-align:center;padding:4px}
.mx td:first-child,.mx th:first-child{text-align:left;padding-left:10px;white-space:nowrap}
.mx button{font:inherit;color:var(--fg);width:100%;min-width:52px;height:34px;border:1px solid transparent;border-radius:6px;cursor:pointer;background:color-mix(in srgb,var(--accent) calc(var(--k)*70%),var(--surface2))}
.mx button:hover{border-color:var(--accent)}
.mx button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.mx button.z{color:var(--muted);background:var(--surface2);cursor:default}
.detail{scroll-margin-top:12px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--accent);border-radius:12px;padding:18px;background:var(--surface)}
.dhead{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start}
.dhead .sub{color:var(--muted);margin-top:4px;display:flex;gap:6px 14px;flex-wrap:wrap}
.filter{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px}
.filter button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:2px 6px;border-radius:999px}
.dkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.dkpis div{background:var(--surface2);border-radius:8px;padding:10px 12px}
.dkpis b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.dkpis span{color:var(--muted);font-size:12px}
.sub-card{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.sub-card h3{margin-bottom:12px}
.empty{color:var(--muted);padding:20px;text-align:center}
.foot{color:var(--muted);font-size:12.5px}
.theme{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;max-width:240px;display:none}
@media(max-width:560px){h1{font-size:23px}.row{grid-template-columns:minmax(70px,110px) 1fr 28px}}
@media(prefers-reduced-motion:no-preference){.detail{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="key" id="initKey"></div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="stamp" id="stamp"></span>
      <button class="theme" id="themeBtn" type="button">Toggle theme</button>
    </div>
  </div>

  <section class="kpis" id="kpis" aria-label="Program summary"></section>

  <section class="grid2">
    <div class="card"><header><h3>Status distribution</h3><p>All stories and tasks</p></header><div id="statusCard"></div></div>
    <div class="card"><header><h3>Issue type and priority</h3><p>Count by status</p></header><div id="typeCard"></div></div>
  </section>

  <section class="card">
    <header><h2>Epics</h2><div class="key-legend" id="statusLegend"></div></header>
    <div class="rows" id="epicRows"></div>
  </section>

  <section>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <h2>Fix versions</h2><span class="hint">Select a version to see its metrics and distribution</span>
    </div>
    <div class="vers" id="vers"></div>
  </section>

  <section class="card">
    <header><h2>Epic by fix version</h2><p>Issue count. Select a cell to filter the version view by epic.</p></header>
    <div class="scroll"><table class="mx" id="matrix"></table></div>
  </section>

  <section id="detail" class="detail" aria-live="polite"></section>

  <p class="foot" id="foot"></p>
</div>
<div id="tip"></div>

<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function(){
const DATA=JSON.parse(document.getElementById('report-data').textContent);
const AS_OF=new Date(DATA.generated.slice(0,10)+'T00:00:00');
const STATUS=['To Do','In Progress','In Review','Done'];
const SCOL={'To Do':'var(--s-todo)','In Progress':'var(--s-prog)','In Review':'var(--s-rev)','Done':'var(--s-done)'};
const ISSUES=DATA.issues, EPICS=DATA.epics, VERS=DATA.versions;
const PRIO=DATA.priorities.slice();
ISSUES.forEach(i=>{if(!PRIO.includes(i.prio))PRIO.push(i.prio)});
const TYPES=[...new Set(ISSUES.map(i=>i.type))];
const EN=Object.fromEntries(EPICS.map(e=>[e.k,e.n]));
const VN=Object.fromEntries(VERS.map(v=>[v.id,v]));
const link=k=>DATA.base?`<a href="${esc(DATA.base)}/browse/${esc(k)}" target="_blank" rel="noopener">${esc(k)}</a>`:esc(k);

const $=id=>document.getElementById(id);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const by=(a,f)=>{const m=new Map();a.forEach(x=>{const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m};
const pct=(n,d)=>d?Math.round(n/d*100):0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const dot=s=>`<span class="dot" style="background:${SCOL[s]}"></span>`;
const sCount=(a,s)=>a.filter(x=>x.status===s).length;
const daysTo=d=>Math.round((new Date(d+'T00:00:00')-AS_OF)/864e5);

function stacked(items){
  const t=items.length;
  return STATUS.map(s=>{const n=sCount(items,s);return n?`<i style="flex:${n};background:${SCOL[s]}" data-tip="${s}: ${n} (${pct(n,t)}%)"></i>`:''}).join('')}
function stackRows(groups){
  const max=Math.max(1,...groups.map(g=>g.items.length));
  return `<div class="rows">`+groups.map(g=>`<div class="row"><div class="lab" title="${esc(g.label)}">${esc(g.label)}${g.sub?`<small>${esc(g.sub)}</small>`:''}</div>
    <div class="track"><div class="bar" style="width:${Math.max(3,g.items.length/max*100)}%">${stacked(g.items)}</div></div><div class="tot num">${g.items.length}</div></div>`).join('')+`</div>`}
function donut(items){
  const t=items.length;let off=0;
  const segs=STATUS.map(s=>{const n=sCount(items,s),p=t?n/t*100:0;const c=n?`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${SCOL[s]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off+25}" data-tip="${s}: ${n}"></circle>`:'';off+=p;return c}).join('');
  const done=pct(sCount(items,'Done'),t);
  return `<div class="donutrow"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Status distribution"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"></circle>${segs}
    <text x="21" y="22.5" text-anchor="middle" font-size="8" font-weight="600">${done}%</text><text x="21" y="28" text-anchor="middle" font-size="3.2" style="fill:var(--muted)">done</text></svg>
    <div class="legend">${STATUS.map(s=>{const n=sCount(items,s);return `<div>${dot(s)}${s}<span class="n num">${n}</span><span class="p num">${pct(n,t)}%</span></div>`}).join('')}</div></div>`}

function health(v,items){
  if(v.state==='Released')return['good','Released'];
  if(v.state==='Unplanned')return['idle','Unplanned'];
  const open=items.length-sCount(items,'Done');
  if(!open)return['good','All done'];
  const done=pct(sCount(items,'Done'),items.length);
  if(v.date){
    const days=daysTo(v.date);
    if(days<0)return['bad','Overdue'];
    if(done===0&&sCount(items,'In Progress')+sCount(items,'In Review')===0)return['idle','Not started'];
    if(days<45&&done<70)return['bad','At risk'];
    if(days<45)return['warn','Watch'];
    return['good','On track'];
  }
  return done===0?['idle','Not started']:['good','In progress'];
}

function renderSummary(){
  const T=ISSUES.length,done=sCount(ISSUES,'Done'),pts=sum(ISSUES,i=>i.pts),dpts=sum(ISSUES.filter(i=>i.status==='Done'),i=>i.pts);
  const people=new Set(ISSUES.map(i=>i.who).filter(w=>w!=='Unassigned'));
  const realVers=VERS.filter(v=>v.state!=='Unplanned').length;
  $('initKey').innerHTML=link(DATA.initiative.key)+' · Initiative'+(DATA.initiative.status?' · '+esc(DATA.initiative.status):'');
  $('title').textContent=DATA.initiative.summary;
  document.title=DATA.initiative.summary+' – Program Report';
  $('stamp').textContent='Data pulled '+new Date(DATA.generated).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  $('meta').innerHTML=`<span>${EPICS.filter(e=>e.k!=='NONE').length} epics</span><span>${realVers} fix versions</span><span>${people.size} assignees</span>`;
  const hasPts=pts>0;
  const tiles=[['Epics',EPICS.filter(e=>e.k!=='NONE').length,`${T} stories and tasks`],['Complete',pct(done,T)+'%',`${done} of ${T} done`],
    ['In flight',sCount(ISSUES,'In Progress')+sCount(ISSUES,'In Review'),'In progress or in review'],['Not started',sCount(ISSUES,'To Do'),'To Do']];
  if(hasPts)tiles.splice(2,0,['Story points',dpts+' / '+pts,`${pct(dpts,pts)}% delivered`]);
  tiles.push(['No fix version',ISSUES.filter(i=>i.ver==='none').length,'Not yet scheduled']);
  $('kpis').innerHTML=tiles.map(t=>`<div class="kpi"><h3>${t[0]}</h3><div class="v num">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('');
  $('statusCard').innerHTML=donut(ISSUES);
  $('typeCard').innerHTML=`<div class="key-legend" style="margin-bottom:10px">${STATUS.map(s=>`<span>${dot(s)}${s}</span>`).join('')}</div>`+
    stackRows(TYPES.map(t=>({label:t,items:ISSUES.filter(i=>i.type===t)})))+`<div style="height:12px"></div>`+
    stackRows(PRIO.map(p=>({label:p,items:ISSUES.filter(i=>i.prio===p)})).filter(g=>g.items.length));
  $('statusLegend').innerHTML=STATUS.map(s=>`<span>${dot(s)}${s}</span>`).join('');
  const sizes=EPICS.map(x=>ISSUES.filter(i=>i.epic===x.k).length);const max=Math.max(1,...sizes);
  $('epicRows').innerHTML=EPICS.map(e=>{
    const it=ISSUES.filter(i=>i.epic===e.k);
    const vs=VERS.map(v=>[v,it.filter(i=>i.ver===v.id).length]).filter(x=>x[1]);
    return `<div class="row" style="grid-template-columns:minmax(120px,230px) 1fr 34px;align-items:start"><div class="lab"><span style="font-weight:500" title="${esc(e.n)}">${esc(e.n)}</span><small>${e.k==='NONE'?'Not linked to an epic':link(e.k)+(e.status?' · '+esc(e.status):'')} · ${pct(sCount(it,'Done'),it.length)}% done${hasPts?' · '+sum(it,i=>i.pts)+' pts':''}</small>
      <div class="chips" style="margin-top:5px">${vs.map(([v,n])=>`<span class="chip">${esc(v.n)} · ${n}</span>`).join('')}</div></div>
      <div class="track" style="padding-top:2px"><div class="bar" style="width:${Math.max(2,it.length/max*100)}%">${stacked(it)}</div></div><div class="tot num">${it.length}</div></div>`}).join('');
  const ex=DATA.excluded;
  $('foot').textContent=`Source: ${DATA.base||'Jira'} · found via ${DATA.strategy}.`+(ex?` ${ex} issues in excluded statuses (${DATA.excludedStatuses.join(', ')}) are not counted.`:'')+` Fix version = the earliest unreleased version on the issue, otherwise its latest released one.`;
}

let sel=location.hash.slice(1),selEpic=null;
if(!VN[sel])sel=(VERS.find(v=>v.state==='Unreleased')||VERS[0]||{id:'none'}).id;
function renderVers(){
  $('vers').innerHTML=VERS.map(v=>{
    const it=ISSUES.filter(i=>i.ver===v.id),h=health(v,it),d=pct(sCount(it,'Done'),it.length);
    return `<button type="button" class="vcard" data-v="${v.id}" aria-pressed="${v.id===sel}">
      <div class="t"><span class="name">${esc(v.n)}</span><span class="pill ${h[0]}">${h[1]}</span></div>
      <div class="d">${v.date?(v.state==='Released'?'Released ':'Release ')+fmtDate(v.date):(v.state==='Unplanned'?'Not assigned to a release':'No release date')}</div>
      <div class="track"><div class="bar" style="width:100%">${stacked(it)}</div></div>
      <div class="cnt"><span><b class="num">${it.length}</b> issues</span><span><b class="num">${d}%</b> done</span>${DATA.hasPoints?`<span><b class="num">${sum(it,i=>i.pts)}</b> pts</span>`:''}</div></button>`}).join('');
  const counts=EPICS.flatMap(e=>VERS.map(v=>ISSUES.filter(i=>i.epic===e.k&&i.ver===v.id).length));
  const mx=Math.max(1,...counts);
  $('matrix').innerHTML='<tr><th>Epic</th>'+VERS.map(v=>`<th>${esc(v.n)}</th>`).join('')+'<th>Total</th></tr>'+EPICS.map(e=>{
    const it=ISSUES.filter(i=>i.epic===e.k);
    return `<tr><td title="${esc(e.n)}">${esc(e.n)}</td>`+VERS.map(v=>{const n=it.filter(i=>i.ver===v.id).length;
      return `<td><button type="button" class="${n?'':'z'}" style="--k:${n/mx}" data-v="${v.id}" data-e="${esc(e.k)}" aria-pressed="${v.id===sel&&selEpic===e.k}" ${n?'':'disabled'}>${n||'–'}</button></td>`}).join('')+`<td class="num"><b>${it.length}</b></td></tr>`}).join('');
}
function renderDetail(){
  const v=VN[sel];
  if(!v){$('detail').innerHTML='<div class="empty">No fix versions found.</div>';return}
  const all=ISSUES.filter(i=>i.ver===sel);let it=all;
  if(selEpic)it=it.filter(i=>i.epic===selEpic);
  const h=health(v,all);
  const done=sCount(it,'Done'),pts=sum(it,i=>i.pts),dpts=sum(it.filter(i=>i.status==='Done'),i=>i.pts);
  const days=v.date?daysTo(v.date):null;
  const unassigned=it.filter(i=>i.who==='Unassigned'&&i.status!=='Done').length;
  const top=PRIO[0];
  const topOpen=it.filter(i=>i.prio===top&&i.status!=='Done').length;
  const dayTxt=days===null?'–':v.state==='Released'?'Shipped':days<0?Math.abs(days)+' d late':days+' d';
  const kp=[[it.length,'Issues'],[pct(done,it.length)+'%','Complete'],[it.length-done,'Still open']];
  if(DATA.hasPoints)kp.splice(2,0,[dpts+' / '+pts,'Story points done']);
  kp.push([topOpen,top+' priority open'],[unassigned,'Open and unassigned'],[dayTxt,v.state==='Released'?'Status':'Until release']);
  const byType=TYPES.map(t=>({label:t,items:it.filter(i=>i.type===t)})).filter(g=>g.items.length);
  const byEpic=EPICS.map(e=>({label:e.n,items:it.filter(i=>i.epic===e.k)})).filter(g=>g.items.length);
  const byWho=[...by(it,i=>i.who)].map(([k,v2])=>({label:k,items:v2,sub:DATA.hasPoints?sum(v2,i=>i.pts)+' pts':''})).sort((a,b)=>b.items.length-a.items.length);
  const byPrio=PRIO.map(p=>({label:p,items:it.filter(i=>i.prio===p)})).filter(g=>g.items.length);
  const order={'In Progress':0,'In Review':1,'To Do':2,'Done':3};
  const rows=[...it].sort((a,b)=>order[a.status]-order[b.status]||a.key.localeCompare(b.key,undefined,{numeric:true}));
  $('detail').innerHTML=`<div class="dhead"><div><h2 style="font-size:22px">${esc(v.n)} <span class="pill ${h[0]}" style="vertical-align:middle">${h[1]}</span></h2>
    <div class="sub"><span>${v.date?(v.state==='Released'?'Released ':'Planned ')+fmtDate(v.date):(v.state==='Unplanned'?'Issues without a fix version':'No release date set')}</span><span>${all.length} issues in this version</span>
    ${selEpic?`<span class="filter">Epic: ${esc(EN[selEpic])}<button type="button" id="clr" aria-label="Clear epic filter">×</button></span>`:''}</div></div>
    <div class="key-legend">${STATUS.map(s=>`<span>${dot(s)}${s}</span>`).join('')}</div></div>
    ${it.length?`<div class="dkpis">${kp.map(k=>`<div><b class="num">${k[0]}</b><span>${esc(k[1])}</span></div>`).join('')}</div>
    <div class="grid2">
      <div class="sub-card"><h3>Status</h3>${donut(it)}</div>
      <div class="sub-card"><h3>By epic</h3>${stackRows(byEpic)}</div>
      <div class="sub-card"><h3>By assignee</h3>${stackRows(byWho)}</div>
      <div class="sub-card"><h3>By type and priority</h3>${stackRows(byType)}<div style="height:12px"></div>${stackRows(byPrio)}</div>
    </div>
    <div class="sub-card"><h3>Issues (${it.length})</h3><div class="scroll tall"><table><thead><tr><th>Key</th><th>Summary</th><th>Type</th><th>Epic</th><th>Assignee</th><th>Priority</th>${DATA.hasPoints?'<th>Pts</th>':''}<th>Status</th></tr></thead><tbody>
    ${rows.map(i=>`<tr><td class="num">${link(i.key)}</td><td>${esc(i.summary)}</td><td>${esc(i.type)}</td><td>${esc(EN[i.epic])}</td><td>${esc(i.who)}</td><td>${esc(i.prio)}</td>${DATA.hasPoints?`<td class="num">${i.pts}</td>`:''}<td><span class="st" title="${esc(i.rawStatus)}">${dot(i.status)}${esc(i.rawStatus)}</span></td></tr>`).join('')}
    </tbody></table></div></div>`:`<div class="empty">No issues for this selection.</div>`}`;
  const c=$('clr');if(c)c.onclick=()=>{selEpic=null;renderAll()}
}
function renderAll(){renderVers();renderDetail()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');if(!b||b.disabled)return;
  sel=b.dataset.v;selEpic=b.dataset.e||null;
  try{history.replaceState(null,'','#'+sel)}catch(_){}
  renderAll();$('detail').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VN[h]){sel=h;selEpic=null;renderAll()}});
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.style.display='none';return}
  tip.textContent=t.getAttribute('data-tip');tip.style.display='block';
  tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px'});
$('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
renderSummary();renderAll();
})();
</script>
</body>
</html>
